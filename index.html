<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Threads Bot Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --accent: #3390ec;
            --accent-gradient: linear-gradient(135deg, #3390ec, #6c5ce7);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass: rgba(255, 255, 255, 0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #2a2a35, #121212);
            color: var(--text-color);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            width: 100%; max-width: 420px; background: var(--card-bg);
            padding: 30px 25px; border-radius: 24px; box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; font-size: 22px;
            background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        label { font-weight: 600; margin-top: 18px; display: block; font-size: 13px; color: var(--hint-color); text-transform: uppercase; text-align: left; }
        input, select, textarea {
            width: 100%; padding: 14px 16px; margin-top: 8px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: var(--glass);
            color: var(--text-color); font-family: 'Inter', sans-serif; font-size: 16px; outline: none; transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 3px rgba(51, 144, 236, 0.2); }
        textarea { resize: vertical; min-height: 100px; }
        button {
            width: 100%; padding: 18px; margin-top: 30px; border: none; border-radius: 16px;
            background: var(--accent-gradient); color: #ffffff; font-size: 16px; font-weight: 700;
            cursor: pointer; box-shadow: 0 10px 20px -5px rgba(51, 144, 236, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden;
        }
        button:active { transform: scale(0.97) translateY(2px); box-shadow: 0 5px 10px -5px rgba(51, 144, 236, 0.6); }
        #status { margin-top: 20px; text-align: center; font-size: 14px; font-weight: 600; padding: 10px; border-radius: 10px; }
        .hidden { display: none !important; }
        .success { color: #28a745; background: rgba(40, 167, 69, 0.1); }
        .error { color: #dc3545; background: rgba(220, 53, 69, 0.1); }
        .loading { color: var(--hint-color); }
        
        #blocked-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        #blocked-screen h1 { font-size: 80px; margin: 0 0 20px 0; }
        #blocked-screen p { font-size: 20px; font-weight: 800; color: #dc3545; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН БЛОКИРОВКИ -->
        <div id="blocked-screen">
            <h1>🖕</h1>
            <p>Доступ запрещен</p>
            <span style="color: var(--hint-color); font-size: 14px; margin-top: 10px;">Иди нахуй, даун</span>
        </div>

        <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
        <div id="main-screen" class="hidden">
            <h2>Threads Auto</h2>
            <label>Действие</label>
            <select id="action" onchange="toggleFields()">
                <option value="warmup">🔥 Прогрев (Warmup)</option>
                <option value="post">🚀 Залив (Post)</option>
            </select>
            <label>ID Профиля</label>
            <input type="text" id="profile_id" placeholder="Например: 1731708887260916">
            
            <div id="warmup_fields">
                <label>Поисковый запрос (для прогрева)</label>
                <input type="text" id="query" placeholder="Например: crypto">
            </div>

            <div id="post_fields" class="hidden">
                <label>Текст поста</label>
                <textarea id="caption" placeholder="Введите текст публикации..."></textarea>
                <label>Прикрепить фото</label>
                <input type="file" id="photo" accept="image/*">
            </div>
            <button onclick="submitTask()">Отправить в работу</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        window.addEventListener('load', () => {
            if (!tg.initData || tg.initData.length === 0) {
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('blocked-screen').style.display = 'flex';
            } else {
                document.getElementById('blocked-screen').style.display = 'none';
                document.getElementById('main-screen').classList.remove('hidden');
            }
        });

        function toggleFields() {
            const action = document.getElementById('action').value;
            const postFields = document.getElementById('post_fields');
            const warmupFields = document.getElementById('warmup_fields');
            if (action === 'post') { 
                postFields.classList.remove('hidden'); 
                warmupFields.classList.add('hidden');
            } 
            else { 
                postFields.classList.add('hidden'); 
                warmupFields.classList.remove('hidden');
            }
        }

        async function submitTask() {
            const initData = tg.initData; 
            if (!initData) {
                alert("Вы должны открыть это приложение через Telegram!");
                return;
            }

            const action = document.getElementById('action').value;
            const profile_id = document.getElementById('profile_id').value;
            const query = document.getElementById('query').value;
            const caption = document.getElementById('caption').value;
            const photoFile = document.getElementById('photo').files[0];
            const statusDiv = document.getElementById('status');

            if (!profile_id) {
                statusDiv.className = 'error'; statusDiv.innerText = 'Ошибка: Введите ID профиля!';
                tg.HapticFeedback.notificationOccurred('error'); return;
            }

            statusDiv.className = 'loading'; statusDiv.innerText = 'Отправка данных...';

            const formData = new FormData();
            formData.append('action', action);
            formData.append('profile_id', profile_id);
            formData.append('init_data', initData);
            if (query && action === 'warmup') formData.append('query', query);
            
            if (action === 'post') {
                if (caption) formData.append('caption', caption);
                if (photoFile) formData.append('photo', photoFile);
            }

            try {
                // ССЫЛКА Т CLOUDFLARE
                const response = await fetch('https://culture-patent-tray-asia.trycloudflare.comm/api/add_task', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();
                if (response.ok) {
                    statusDiv.className = 'success'; statusDiv.innerText = '✅ Успешно добавлено в очередь!';
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert('Задача добавлена в очередь!');
                    if (action === 'post') { 
                        document.getElementById('caption').value = ''; 
                        document.getElementById('photo').value = ''; 
                    }
                } else {
                    throw new Error(result.message || 'Ошибка сервера');
                }
            } catch (error) {
                statusDiv.className = 'error'; statusDiv.innerText = '❌ Ошибка: ' + error.message;
                tg.HapticFeedback.notificationOccurred('error');
            }
        }
    </script>
</body>
</html>
